name: Deploy Performance Lab to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build site
        run: |
          if [ -n "$CLOUD_PROJECT_URL" ] && [ -n "$CLOUD_PUBLISHABLE_KEY" ]; then
            export VITE_SUPABASE_URL="$CLOUD_PROJECT_URL"
            export VITE_SUPABASE_PUBLISHABLE_KEY="$CLOUD_PUBLISHABLE_KEY"
          fi
          npm run build
        env:
          CLOUD_PROJECT_URL: ${{ vars.VITE_SUPABASE_URL }}
          CLOUD_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
