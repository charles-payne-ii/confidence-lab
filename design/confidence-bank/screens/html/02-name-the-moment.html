<style>
body{margin:0}

<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px 36px; background: #f4f3f6; color: #1c1a22; font-family: 'EB Garamond', Georgia, serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="01-intro.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start; text-decoration: none; font-size: 26px; color: #686473">‹</a>
    <div style="display: flex; gap: 8px" aria-label="Step 1 of 4">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #8a6a3b"></span>
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #c6c2cf"></span>
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #c6c2cf"></span>
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #c6c2cf"></span>
    </div>
    <span style="width: 44px"></span>
  </div>
  <p style="margin: 36px 0 0; font-family: 'Cinzel', Georgia, serif; font-size: 12px; letter-spacing: 0.22em; color: #8a6a3b">MEMORY 1 · STEP 1 OF 4</p>
  <h1 style="margin: 12px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 38px; line-height: 1.08">Name the moment</h1>
  <p style="margin: 10px 0 0; font-size: 17px; line-height: 1.45; color: #4a4752">A short title in the past tense, without “I”.</p>
  <label for="title" style="margin-top: 28px; font-family: 'Cinzel', Georgia, serif; font-size: 11px; letter-spacing: 0.2em; color: #686473">TITLE</label>
  <input id="title" type="text" placeholder="Led the difficult client presentation" style="margin-top: 8px; height: 54px; box-sizing: border-box; padding: 0 14px; border: 1px solid #c6c2cf; border-radius: 0; background: #ffffff; font-family: 'EB Garamond', Georgia, serif; font-size: 18px; color: #1c1a22">
  <p style="margin: 28px 0 0; font-family: 'Cinzel', Georgia, serif; font-size: 11px; letter-spacing: 0.2em; color: #686473">TYPE <span style="letter-spacing: 0; font-family: 'EB Garamond', Georgia, serif; font-size: 14px; font-style: italic; text-transform: none">(optional)</span></p>
  <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px">
    <button aria-pressed="true" style="height: 42px; padding: 0 16px; border: 1px solid #8a6a3b; background: #efe7d9; color: #1c1a22; font-family: 'EB Garamond', Georgia, serif; font-size: 17px">Success</button>
    <button aria-pressed="false" style="height: 42px; padding: 0 16px; border: 1px solid #c6c2cf; background: #fbfafc; color: #1c1a22; font-family: 'EB Garamond', Georgia, serif; font-size: 17px">Effort</button>
    <button aria-pressed="false" style="height: 42px; padding: 0 16px; border: 1px solid #c6c2cf; background: #fbfafc; color: #1c1a22; font-family: 'EB Garamond', Georgia, serif; font-size: 17px">Progress</button>
  </div>
  <a href="03-what-happened.html" style="margin-top: auto; height: 54px; display: flex; align-items: center; justify-content: center; background: #1c1a22; color: #f4f3f6; text-decoration: none; font-family: 'Cinzel', Georgia, serif; font-size: 13px; letter-spacing: 0.2em">CONTINUE</a>
