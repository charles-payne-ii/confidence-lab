<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confidence Bank pillar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes tierglow{0%{box-shadow:0 0 0 0 rgba(201,168,98,0)}40%{box-shadow:0 0 14px 2px rgba(201,168,98,.75)}100%{box-shadow:0 0 0 0 rgba(201,168,98,0)}}
.newtier{animation:tierglow 10s ease-in-out infinite}
</style>
</helmet>
<div role="img" aria-label="{{ label }}" style="width: 120px; box-sizing: border-box; padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 3px">
  <div style="width: 84px; height: 7px; background: {{ bar }}"></div>
  <div style="width: 72px; height: 4px; background: {{ bar }}"></div>
  <div style="width: 64px; height: 3px; background: {{ bar }}; margin-bottom: 3px"></div>
  <sc-for list="{{ tiers }}" as="t" hint-placeholder-count="10">
    <div class="{{ t.cls }}" style="width: 54px; height: {{ t.h }}px; box-sizing: border-box; border: 1px solid {{ t.border }}; background: {{ t.bg }}"></div>
  </sc-for>
  <div style="width: 64px; height: 3px; background: {{ bar }}; margin-top: 3px"></div>
  <div style="width: 72px; height: 4px; background: {{ bar }}"></div>
  <div style="width: 84px; height: 7px; background: {{ bar }}"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"n":{"editor":"int","default":4,"min":0,"max":10},"tierH":{"editor":"int","default":20,"min":8,"max":30},"highlightNew":{"editor":"boolean","default":false},"onDark":{"editor":"boolean","default":false},"$preview":{"width":120,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const n = Math.max(0, Math.min(10, this.props.n ?? 4));
    const h = this.props.tierH ?? 20;
    const hl = this.props.highlightNew ?? false;
    const dark = this.props.onDark ?? false;
    const tiers = [];
    for (let i = 10; i >= 1; i--) {
      const on = i <= n;
      tiers.push({ h, bg: on ? '#c9a862' : 'transparent', border: on ? (dark ? '#c9a862' : '#8a6a3b') : (dark ? '#574565' : '#c6c2cf'), cls: hl && i === n ? 'newtier' : '' });
    }
    return { tiers, bar: dark ? '#c9a862' : '#1c1a22', label: n + ' of 10 memories in your Confidence Bank' };
  }
}
</script>
</body>
</html>
