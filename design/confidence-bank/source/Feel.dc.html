<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture: What you felt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1c1a22}a:hover{color:#8a6a3b}
input::placeholder{color:#8f8a99}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px 36px; background: #f4f3f6; color: #1c1a22; font-family: 'EB Garamond', Georgia, serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="Shows.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; text-decoration: none; font-size: 26px; color: #686473">‹</a>
    <div style="display: flex; gap: 8px" aria-label="Step 4 of 4">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #8a6a3b"></span>
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #8a6a3b"></span>
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #8a6a3b"></span>
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #8a6a3b"></span>
    </div>
    <span style="width: 44px"></span>
  </div>
  <p style="margin: 36px 0 0; font-family: 'Cinzel', Georgia, serif; font-size: 12px; letter-spacing: 0.22em; color: #8a6a3b">MEMORY 1 · STEP 4 OF 4</p>
  <h1 style="margin: 12px 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 38px; line-height: 1.08">Return to that moment. What did you feel?</h1>
  <p style="margin: 10px 0 0; font-size: 17px; line-height: 1.45; color: #4a4752">Take a breath and picture it. Choose any that fit.</p>
  <div style="margin-top: 24px; display: flex; flex-wrap: wrap; gap: 8px">
    <sc-for list="{{ chips }}" as="c" hint-placeholder-count="7">
      <button onClick="{{ c.pick }}" aria-pressed="{{ c.pressed }}" style="height: 42px; padding: 0 16px; border: 1px solid {{ c.border }}; background: {{ c.bg }}; color: #1c1a22; font-family: 'EB Garamond', Georgia, serif; font-size: 17px; cursor: pointer">{{ c.label }}</button>
    </sc-for>
  </div>
  <label for="ownfeel" style="margin-top: 26px; font-family: 'Cinzel', Georgia, serif; font-size: 11px; letter-spacing: 0.2em; color: #686473">IN YOUR OWN WORDS</label>
  <input id="ownfeel" type="text" placeholder="For example: steady, like the room was mine" style="margin-top: 8px; height: 54px; box-sizing: border-box; padding: 0 14px; border: 1px solid #c6c2cf; border-radius: 0; background: #ffffff; font-family: 'EB Garamond', Georgia, serif; font-size: 18px; color: #1c1a22">
  <a href="Confirm.dc.html" style="margin-top: auto; height: 54px; display: flex; align-items: center; justify-content: center; background: #1c1a22; color: #f4f3f6; text-decoration: none; font-family: 'Cinzel', Georgia, serif; font-size: 13px; letter-spacing: 0.2em">REVIEW MEMORY</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { on: { Focused: true, Capable: true, Proud: true } }; }
  renderVals() {
    const all = ['Proud', 'Calm', 'Strong', 'Relieved', 'Energized', 'Capable', 'Focused'];
    const on = this.state.on;
    return {
      chips: all.map(label => ({
        label,
        pressed: on[label] ? 'true' : 'false',
        bg: on[label] ? '#efe7d9' : '#fbfafc',
        border: on[label] ? '#8a6a3b' : '#c6c2cf',
        pick: () => this.setState({ on: { ...on, [label]: !on[label] } })
      }))
    };
  }
}
</script>
</body>
</html>
