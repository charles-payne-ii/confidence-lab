<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confidence Bank list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1c1a22}a:hover{color:#8a6a3b}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px 28px; background: #f4f3f6; color: #1c1a22; font-family: 'EB Garamond', Georgia, serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; height: 44px">
    <a href="Home.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; display: flex; align-items: center; text-decoration: none; font-size: 26px; color: #686473">‹</a>
  </div>
  <div style="margin-top: 8px; display: flex; align-items: center; gap: 12px; padding-bottom: 18px; border-bottom: 3px double #c6c2cf">
    <dc-import name="Pillar" n="{{ n }}" tier-h="{{ th }}" hint-size="120px,150px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 34px; line-height: 1.05">Confidence Bank</h1>
      <span style="font-size: 18px">4 of 10 memories</span>
      <span style="font-size: 15px; font-style: italic; color: #686473">Foundation set</span>
    </div>
  </div>
  <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
    <sc-for list="{{ mems }}" as="m" hint-placeholder-count="4">
      <li style="padding: 14px 0; border-bottom: 1px solid #dcd9e2; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px">
          <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; font-weight: 500; line-height: 1.15">{{ m.title }}</span>
          <span style="flex: none; font-family: 'Cinzel', Georgia, serif; font-size: 10px; letter-spacing: 0.16em; color: #8a6a3b">{{ m.tag }}</span>
        </div>
        <span style="font-size: 15px; color: #4a4752">Showed {{ m.ev }}</span>
        <div style="display: flex; gap: 18px; margin-top: 2px">
          <a href="Confirm.dc.html" style="font-size: 15px; color: #686473">View and edit</a>
          <button style="padding: 0; border: 0; background: none; font-family: 'EB Garamond', Georgia, serif; font-size: 15px; color: #9b382f; cursor: pointer">Delete</button>
        </div>
      </li>
    </sc-for>
  </ul>
  <a href="Name.dc.html" style="margin-top: auto; height: 54px; display: flex; align-items: center; justify-content: center; background: #1c1a22; color: #f4f3f6; text-decoration: none; font-family: 'Cinzel', Georgia, serif; font-size: 13px; letter-spacing: 0.2em">ADD A MEMORY</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      n: 4, th: 8,
      mems: [
        { title: 'Led the difficult client presentation', tag: 'SUCCESS', ev: 'preparation, calm, leadership' },
        { title: 'Finished the qualifying run after a bad start', tag: 'EFFORT', ev: 'persistence, courage' },
        { title: 'Passed the certification on the second attempt', tag: 'PROGRESS', ev: 'persistence, skill' },
        { title: 'Talked a tense team through a crisis', tag: 'SUCCESS', ev: 'judgment, calm' }
      ]
    };
  }
}
</script>
</body>
</html>
